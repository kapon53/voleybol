<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Smaç Zamanı!</title>
<style>
  html,body{margin:0;height:100%;background:#0b1633;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100dvh;width:auto;max-width:100vw;aspect-ratio:9/16;display:block}
  #ov{position:fixed;display:none;z-index:5;font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff}
  #fm{position:absolute;left:9%;right:9%;top:43%;display:flex;flex-direction:column;gap:calc(var(--s)*9px)}
  #fm label{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--s)*15px);font-weight:bold}
  #fm input{width:52%;box-sizing:border-box;font-family:inherit;font-weight:bold;font-size:max(16px,calc(var(--s)*17px));padding:calc(var(--s)*7px);border-radius:calc(var(--s)*10px);border:2px solid #ffd400;background:#0b1633;color:#fff;text-align:center;text-transform:uppercase}
  #roles{display:flex;gap:calc(var(--s)*6px)}
  #roles button{flex:1;font-family:inherit;font-weight:bold;font-size:calc(var(--s)*14px);padding:calc(var(--s)*9px) 0;border-radius:calc(var(--s)*10px);border:2px solid #ffd400;background:#0b1633;color:#ffd400}
  #roles button.on{background:#ffd400;color:#14275e}
  #rd{font-size:calc(var(--s)*12px);text-align:center;color:rgba(255,255,255,.8);min-height:calc(var(--s)*30px)}
  #go{font-family:inherit;font-weight:bold;font-size:calc(var(--s)*26px);padding:calc(var(--s)*10px);border-radius:calc(var(--s)*32px);border:0;background:#ffd400;color:#14275e}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div id="ov"><div id="fm">
  <label>Adın <input id="nm" maxlength="12" placeholder="ADIN" autocomplete="off"></label>
  <label>Forma numaran <input id="no" type="number" inputmode="numeric" min="0" max="99" value="10"></label>
  <div id="roles"><button data-r="0" class="on">Smaçör</button><button data-r="1">Pasör</button><button data-r="2">Libero</button></div>
  <div id="rd"></div>
  <button id="go">BAŞLA</button>
</div></div>

const NAVY="#14275e", YEL="#ffd400", RED="#c8102e", W=360, H=640, NET=330;

let state="start", fb=0, gs=0, t=0, ball=null, parts=[], popup=null, flash=0, endT=0, wait=0;

// ---------- ses ----------
let AC=null, crowd=null, noiseG=null, crowdFail=false, vol=.35, volT=.35;
function initAudio(){
  if(crowd) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  crowd=new Audio(CROWD_SRC); crowd.loop=true; crowd.volume=.35;
  crowd.addEventListener("error",failCrowd);
  const p=crowd.play(); if(p&&p.catch) p.catch(e=>{ if(e&&e.name!=="NotAllowedError") failCrowd(); });
}
function failCrowd(){ // mp3 yoksa yedek: sentetik kalabalık uğultusu
  if(crowdFail||!AC) return; crowdFail=true;
  const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; s.loop=true;
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=700; f.Q.value=.6;
  noiseG=AC.createGain(); noiseG.gain.value=.05; s.connect(f); f.connect(noiseG); noiseG.connect(AC.destination); s.start();
}
function beep(f,d,type){ try{ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"square"; o.frequency.value=f; g.gain.value=.07; g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }catch(e){} }
function whistle(){ beep(1500,.18,"sine"); setTimeout(()=>beep(1500,.3,"sine"),220); }

// ---------- yardımcılar ----------
function drawLogo(img,x,y,s,fbk){
  if(img.complete&&img.naturalWidth){ const k=Math.min(s/img.naturalWidth,s/img.naturalHeight), w=img.naturalWidth*k, h=img.naturalHeight*k; ctx.drawImage(img,x-w/2,y-h/2,w,h); return; }
  ctx.fillStyle=YEL; ctx.beginPath(); ctx.arc(x,y,s/2,0,7); ctx.fill();
  ctx.fillStyle=NAVY; ctx.beginPath(); ctx.arc(x,y,s/2-s*.14,0,7); ctx.fill();
  ctx.fillStyle=YEL; ctx.font="bold "+(s*.34)+"px Georgia"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(fbk||"FB",x,y+1);
}
function text(s,x,y,size,col,align){ ctx.font="bold "+size+"px 'Trebuchet MS',Verdana,sans-serif"; ctx.textAlign=align||"center"; ctx.textBaseline="middle"; ctx.fillStyle=col||"#fff"; ctx.fillText(s,x,y); }
function burst(x,y,n,cols){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=60+Math.random()*220;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,l:1,c:cols[i%cols.length],r:2+Math.random()*3}); } }
const CONF=[YEL,NAVY,"#fff","#ff5d73","#3ad1ff","#7dff6b","#ff9f1c","#c77dff"];
function confetti(x,y,n,dir){ dir=dir==null?-Math.PI/2:dir;
  for(let i=0;i<n;i++){ const a=dir+(Math.random()-.5)*1.5, sp=220+Math.random()*420;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1.7,dk:.45,c:CONF[Math.floor(Math.random()*CONF.length)],r:3+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*16}); } }
function drawParts(){ parts.forEach(p=>{ ctx.globalAlpha=Math.max(0,Math.min(1,p.l)); ctx.fillStyle=p.c;
  if(p.rot==null){ ctx.fillRect(p.x,p.y,p.r*1.6,p.r*1.6); return; }
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r*.9,-p.r*.5,p.r*1.8,p.r); ctx.restore(); }); ctx.globalAlpha=1; }
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,"triangle"),i*110)); }
const jump=r=>(r<.5&&r>-.15)?46*Math.sin(Math.PI*(.5-r)/.65):0;
function blockers(){ const sp=2.1+fb*.18; return [105+Math.sin(t*sp)*55, 255+Math.sin(t*sp*1.15+2)*55]; }

// ---------- taraftar ----------
const fansT=[], fansB=[];
for(let r=0;r<3;r++) for(let i=0;i<25;i++) fansT.push({x:6+i*14.5+(r%2)*7,y:12+r*15,c:(i+r)%2?RED:YEL,p:Math.random()*6});
for(let r=0;r<3;r++) for(let i=0;i<16;i++) fansB.push({x:12+i*22.5+(r%2)*11,y:598+r*18,c:["#ffd400","#2b4aa8","#fff"][(i+r)%3],p:Math.random()*6});
function stands(){
  ctx.fillStyle="#2a0a14"; ctx.fillRect(0,0,W,58);
  fansT.forEach(f=>{ const b=exT>.05?Math.abs(Math.sin(t*9+f.p))*exT*8:0;
    ctx.fillStyle=f.c; ctx.fillRect(f.x-4,f.y-b+4,8,9); ctx.fillStyle="#f2c9a0"; ctx.beginPath(); ctx.arc(f.x,f.y-b,4,0,7); ctx.fill(); });
  ctx.fillStyle="#0c1a44"; ctx.fillRect(0,566,W,74);
  ctx.fillStyle=YEL; ctx.fillRect(0,566,W,3);
  fansB.forEach(f=>{ const b=exB>.05?Math.abs(Math.sin(t*9+f.p))*exB*12:0;
    ctx.fillStyle=f.c; ctx.fillRect(f.x-6,f.y-b+6,12,14); ctx.fillStyle="#f2c9a0"; ctx.beginPath(); ctx.arc(f.x,f.y-b,6,0,7); ctx.fill();
    if(exB>.3&&f.c!=="#fff"){ ctx.fillStyle=f.c; ctx.fillRect(f.x+6,f.y-b-14,4,14); } });
}

// ---------- oyuncu çizimi ----------
function person(x,y,o){
  const jy=y-(o.jump||0), up=o.up||0;
  ctx.fillStyle="rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(x,y+2,15,5,0,0,7); ctx.fill();
  ctx.fillStyle="#f2c9a0"; ctx.fillRect(x-9,jy-14,6,14); ctx.fillRect(x+3,jy-14,6,14);
  ctx.fillStyle=o.s; ctx.fillRect(x-12,jy-24,24,11);
  ctx.fillStyle=o.j; ctx.fillRect(x-14,jy-46,28,23);
  ctx.strokeStyle="#f2c9a0"; ctx.lineWidth=6; ctx.lineCap="round";
  const hy=up?jy-46-up*30:jy-26;
  ctx.beginPath(); ctx.moveTo(x-14,jy-42); ctx.lineTo(x-19+up*5,hy); ctx.moveTo(x+14,jy-42); ctx.lineTo(x+19-up*5,hy); ctx.stroke();
  ctx.fillStyle="#f2c9a0"; ctx.beginPath(); ctx.arc(x,jy-55,9,0,7); ctx.fill();
  ctx.fillStyle=o.hair;
  if(o.front){ ctx.beginPath(); ctx.arc(x,jy-57,9.5,Math.PI,0); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(x,jy-55,9.5,0,7); ctx.fill(); ctx.fillRect(x+5,jy-54,4,14); }
  if(o.name){ ctx.save(); ctx.font="bold 7px Verdana"; const w=ctx.measureText(o.name).width;
    ctx.translate(x,jy-42); ctx.scale(Math.min(1.2,26/w),1); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=o.tc; ctx.fillText(o.name,0,0); ctx.restore(); }
  if(o.num!=null) text(String(o.num),x,jy-(o.name?31:35),13,o.tc||NAVY);
  if(o.tag){ ctx.font="bold 10px Verdana"; const w=ctx.measureText(o.tag).width+10;
    ctx.fillStyle=o.tagbg||"rgba(11,22,51,.8)"; ctx.beginPath(); ctx.roundRect(x-w/2,y+9,w,15,7); ctx.fill(); text(o.tag,x,y+17,10,YEL); }
}
function ballDraw(x,y){
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,11,0,7); ctx.fill();
  ctx.strokeStyle=NAVY; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,11,0,7); ctx.moveTo(x-11,y); ctx.quadraticCurveTo(x,y-7,x+11,y); ctx.moveTo(x,y-11); ctx.quadraticCurveTo(x+8,y,x,y+11); ctx.stroke();
}

const MY=[mk(80,410,{name:HITTER,hair:"#e8c26a"}),mk(280,410,{name:SETTER,hair:"#3a2a1a"}),mk(180,495,{name:NAME,hair:"#5a3a1e"})];
const OP=[mk(105,292,{}),mk(255,292,{}),mk(180,150,{})];
const pick=(a,not)=>{ const c=a.filter(i=>i!==not); return c[Math.floor(Math.random()*c.length)]; };
const W_RCV=[1,1,3], W_SET=[1,3,1], W_ATK=[3,1,1]; // sol file=smaçör, sağ file=pasör, arka=libero: kim hangi vuruşu daha çok yapar
const pickW=(w,not)=>{ const ix=[0,1,2].filter(i=>i!==not); let r=Math.random()*ix.reduce((a,i)=>a+w[i],0);
  for(const i of ix){ r-=w[i]; if(r<=0) return i; } return ix[ix.length-1]; };
function setup(){ // seçilen pozisyona göre oyuncuyu yerleştir
  const me={name:NAME,num:NUM,hair:"#5a3a1e"}, O={name:SETTER,num:SETTER_NUM,hair:"#3a2a1a"}, F={name:HITTER,num:HITTER_NUM,hair:"#e8c26a"};
  const sl=[[me,O,F],[F,me,O],[F,O,me]][ROLE];
  MY.forEach((p,i)=>Object.assign(p,sl[i],{x:p.hx,y:p.hy,hr:null,up:0,bj:0}));
  OP.forEach((p,i)=>Object.assign(p,OPP[i],{x:p.hx,y:p.hy,hr:null,up:0,bj:0}));
}
function launch(kind,tx,ty,tz,dur,arc,need,q){
  return ball.seg={kind,sx:ball.x,sy:ball.y,sz:ball.z,tx,ty,tz,dur,arc,need,q:q||0,el:0,crossed:false};
}
function inLaunch(dur,arc,blk){ // top bizim sahaya geliyor: rastgele bir oyuncumuz karşılar
  const i=pickW(W_RCV), h=MY[i];
  ball.chain=0; ball.rcv=i; ball.dig=false;
  const s=launch("in",ck(h.hx+Math.random()*60-30,50,310),h.hy+Math.random()*20-10,34,dur,arc,true);
  s.lbl=blk?"KURTAR!":"PAS"; s.blk=blk; return s;
}
function begin(){ fb=0; gs=0; popup=null; parts=[]; server="me"; serve(); }
function serve(){ // sayıyı alan takım servis atar
  state="play";
  if(server==="me"){ const p=MY[2]; p.x=p.hx; p.y=p.hy; ball={x:p.x,y:p.y,z:50,chain:0,dig:false};
    launch("sv",p.x,p.y,50,.85,45,true).lbl="SERVİS"; ball.seg.el=-.6; }
  else { const sx=70+Math.random()*220; OP[2].x=OP[2].tx=sx; OP[2].y=OP[2].ty=150;
    ball={x:sx,y:150,z:50,chain:0,dig:false}; inLaunch(Math.max(.6,1.0-fb*.05),90); ball.seg.el=-.9; }
}
function endPoint(){ ball.seg=null; if(state==="play"){ state="point"; wait=1.5; } }
function fbPoint(msg){
  fb++; server="me"; lastWin="me"; celeb=0; exB=1; volT=1; popup={t:msg,l:1}; whistle(); burst(ball.x,ball.y-ball.z,30,[YEL,NAVY,"#fff"]);
  if(fb>=GOAL){ state="win"; endT=1.5; ball.seg=null; gp=0; gt=0; landed=false; popped=false; lett=false; parts=[]; } else endPoint();
}
function gsPoint(msg){
  gs++; server="opp"; lastWin="opp"; celeb=0; exT=1; flash=.35; popup={t:msg,l:1}; whistle();
  if(gs>=GOAL){ state="over"; endT=1.2; ball.seg=null; } else endPoint();

// rakip 3 vuruşluk atak: 1) savunma 2) pas 3) smaç
function oppSeq(){ OP[2].up=.3; beep(300,.12); popup={t:"Savundular!",l:.8}; ball.who=2; oppNext("o2"); }
function oppNext(kind){
  const i=kind==="o2"?pickW([1,3,0],ball.who):pickW(W_ATK,ball.who), p=OP[i];
  const pt=i<2?{x:ck(p.x+Math.random()*40-20,60,300),y:284}:{x:p.x,y:165};
  ball.blkDone=false; ball.blk=0; p.tx=pt.x; p.ty=pt.y; launch(kind,pt.x,pt.y,kind==="o3"?100:55,kind==="o3"?.5:.5,80,false).who=i; ball.who=i;

function tap(e){
  e.preventDefault(); initAudio();
  const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W;
  if(state==="start") return;
  if(state==="win"){ // ödül sahnesi: kutuya dokun -> açılır; mektup görününce dokun -> yeni oyun
    if(gp===0&&gt>1.1){ gp=1; gt=0; popped=false; beep(400,.08,"triangle"); }
    else if(gp===2&&gt>2.4){ state="start"; }
    return; }
  if(state==="over"&&endT<=0){ begin(); return; }
  if(state!=="play"||!ball||!ball.seg) return;
  if(ball.seg.kind==="o3"){ // rakip smaç vuruyor: BLOK için dokun
    const rb=ball.seg.dur-ball.seg.el; if(ball.blkDone||rb>.4||ball.seg.el<0) return;
    ball.blkDone=true; ball.blk=rb<.1?2:(rb<.3?1:0); MY[0].bj=MY[1].bj=.35; beep(260,.1); return; }
  if(!ball.seg.need) return;
  const s=ball.seg, rem=s.dur-s.el, k=s.kind;
  if(rem>.3) return;
  const q=Math.abs(rem)<.06; if(q){ ball.chain++; popup={t:"MÜKEMMEL!",l:.7}; }
  if(k==="sv"){ MY[2].up=.3; beep(q?800:550,.15);
    const tx=px<W/2?60+Math.random()*110:190+Math.random()*110, ty=150+Math.random()*40;
    launch("sout",tx,ty,0,q?.5:.68,100,false,q); ball.dig=Math.random()<(q?.5:.97);
    if(ball.dig){ OP[2].tx=tx; OP[2].ty=ty; } }
  else if(k==="in"){ const i=ball.rcv, j=pickW(W_SET,i); MY[i].up=.3; beep(450,.1);
    launch("t2",MY[j].x,MY[j].y,55,q?.78:.66,85,true,q).who=j; ball.seg.lbl="SET"; }
  else if(k==="t2"){ const i=s.who, j=pickW(W_ATK,i); MY[i].up=.3; beep(520,.1);
    launch("t3",MY[j].x,MY[j].y,100,q?.88:.75,115,true,q).who=j; ball.seg.lbl="◀ SMAÇ ▶"; }
  else if(k==="t3"){ MY[s.who].up=.3; beep(q?800:600,.15); burst(ball.x,ball.y-ball.z,q?20:8,[YEL,"#fff"]);
    const tx=px<W/2?85:275; launch("spike",tx,150,0,q?.27:.38,0,false,q);
    ball.dig=Math.abs(tx-OP[2].x)<96&&Math.random()<Math.max(.45,.95-.08*ball.chain-.005*fb);
    if(ball.dig){ OP[2].tx=tx; OP[2].ty=150; } }
}
cv.addEventListener("pointerdown",tap);

function endSeg(k,sg){
  if(k==="spike"||k==="sout"){ if(ball.dig) oppSeq(); else fbPoint(k==="sout"?"ASE!":(ball.chain>=3?"EFSANE SMAÇ!":"SAYI!")); }
  else if(k==="o2"){ OP[sg.who].up=.3; beep(320,.1); oppNext("o3"); }
  else if(k==="o3"){ OP[sg.who].up=.3; beep(600,.12);
    if(ball.blk===2){ popup={t:"BLOK!",l:.9}; beep(160,.2,"sawtooth"); burst(ball.x,NET,14,["#fff",YEL]);
      const tx=ck(ball.x+Math.random()*60-30,50,310), ty=190+Math.random()*60; ball.dig=Math.random()<.35;
      launch("kb",tx,ty,0,.35,0,false); if(ball.dig){ OP[2].tx=tx; OP[2].ty=ty; } }
    else if(ball.blk===1){ popup={t:"Bloka değdi!",l:.8}; inLaunch(1.4,60); }
    else inLaunch(Math.max(.55,.95-fb*.05),30); }
  else if(k==="kb"){ if(ball.dig) oppSeq(); else fbPoint("BLOK SAYISI!"); }
  else if(k==="drop") gsPoint(sg.msg||"Kaçırdın!");
}

function update(dt){
  t+=dt; flash=Math.max(0,flash-dt); endT=Math.max(0,endT-dt); exB=Math.max(0,exB-dt*.5); exT=Math.max(0,exT-dt*.5);
  vol+=(volT-vol)*Math.min(1,dt*3); volT=Math.max(.35,volT-dt*.35);
  if(crowd&&!crowdFail) crowd.volume=ck(vol,0,1); if(noiseG) noiseG.gain.value=vol*.14;
  if(popup){ popup.l-=dt*1.2; if(popup.l<=0) popup=null; }
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.l-=dt*(p.dk||.8); if(p.rot!=null) p.rot+=p.vr*dt; if(p.dk){ p.vx*=1-dt*.9; }}); parts=parts.filter(p=>p.l>0);
  if(state==="win"){
    gt+=dt;
    if(gp===0&&!landed&&gt>=.35){ landed=true; fanfare(); confetti(0,H,45,-Math.PI/2+.7); confetti(W,H,45,-Math.PI/2-.7); confetti(W/2,420,50); }
    if(gp===0&&landed&&gt>1.1&&Math.random()<.25) confetti(Math.random()*W,-10,1,Math.PI/2);
    if(gp===1&&!popped&&gt>=.5){ popped=true; beep(700,.15,"triangle"); confetti(W/2,380,90); }
    if(gp===1&&gt>=1.8){ gp=2; gt=0; lett=false; }
    if(gp===2&&!lett&&gt>=.8){ lett=true; fanfare(); confetti(0,H,50,-Math.PI/2+.7); confetti(W,H,50,-Math.PI/2-.7); confetti(W/2,300,70); }
    if(gp===2&&gt>1.5&&Math.random()<.5) parts.push({x:Math.random()*W,y:-8,vx:Math.random()*40-20,vy:40+Math.random()*60,l:3,dk:.3,c:CONF[Math.floor(Math.random()*CONF.length)],r:3+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*10});
  }
  const sg=ball&&ball.seg, hold=[false,false,false], bl=blockers();
  if(sg){ if(sg.kind==="o2"||sg.kind==="o3") hold[sg.who]=true;
    if((sg.kind==="spike"||sg.kind==="sout"||sg.kind==="kb")&&ball.dig) hold[2]=true;
    if(server==="opp"&&sg.kind==="in"&&sg.el<0) hold[2]=true; }
  OP.forEach((p,i)=>{ if(!hold[i]){ p.tx=i<2?bl[i]:180+Math.sin(t*2)*85; p.ty=i<2?292:150; } });
  MY.forEach((p,i)=>{ if(sg&&sg.kind==="in"&&sg.el>=0&&ball.rcv===i){ p.tx=sg.tx; p.ty=sg.ty; } else { p.tx=p.hx; p.ty=p.hy; } });
  if(sg&&sg.kind==="o3"&&sg.el>=0&&sg.dur-sg.el<.9&&!ball.blkDone){ // file önünde blok hazırlığı
    MY[0].tx=ck(sg.tx-26,30,330); MY[1].tx=ck(sg.tx+26,30,330); MY[0].ty=MY[1].ty=366; }
  if(state==="point"||state==="win"||state==="over"){ // sayıdan sonra iki takım da kendi sahasının ortasında toplanır, sayıyı alan zıplar
    MY.forEach((p,i)=>{ p.tx=180+(i-1)*28; p.ty=455; }); OP.forEach((p,i)=>{ p.tx=180+(i-1)*28; p.ty=205; });
    celeb-=dt; if(celeb<=0){ celeb=.55; (lastWin==="me"?MY:OP).forEach(p=>p.bj=.35); } }
  [...MY,...OP].forEach(p=>{ const m=Math.min(1,dt*7); p.x+=(p.tx-p.x)*m; p.y+=(p.ty-p.y)*m; p.up=Math.max(0,p.up-dt); p.bj=Math.max(0,p.bj-dt); });
  [[MY,"t3"],[OP,"o3"]].forEach(([T,kd])=>T.forEach((p,i)=>{
    if(sg&&sg.kind===kd&&sg.who===i&&sg.el>=0) p.hr=sg.dur-sg.el; else if(p.hr!==null){ p.hr-=dt; if(p.hr<-.15) p.hr=null; } }));
  if(state==="point"){ wait-=dt; if(wait<=0) serve(); return; }
  if(state!=="play"||!sg) return;
  sg.el+=dt;
  const k=ck(sg.el/sg.dur,0,1);
  ball.x=sg.sx+(sg.tx-sg.sx)*k; ball.y=sg.sy+(sg.ty-sg.sy)*k; ball.z=sg.sz+(sg.tz-sg.sz)*k+sg.arc*Math.sin(k*Math.PI);
  if(sg.kind==="spike"&&!sg.crossed&&ball.y<=NET){
    sg.crossed=true;
    const p=Math.abs(ball.x-OP[0].x)<Math.abs(ball.x-OP[1].x)?OP[0]:OP[1], d=Math.abs(ball.x-p.x);
    if(d<75) p.bj=.35; // blok denemesi
    if(d<58-ball.chain*3){ // blok: top bize döner, karşılayabiliriz!
      beep(150,.2,"sawtooth"); burst(ball.x,NET,14,["#fff",RED]); popup={t:"BLOK!",l:.8};
      inLaunch(.7,20,true); return; }
  }
  if(sg.el>=sg.dur){
    if(sg.need){ if(sg.el>sg.dur+.08){ beep(120,.3,"sawtooth");
      launch("drop",ball.x,ball.y,0,.3,0,false).msg=sg.kind==="sv"?"Servis hatası!":(sg.blk?"Blok yedin!":"Kaçırdın!"); } }
    else endSeg(sg.kind,sg);
  }
}


// ---------- ödül sahnesi: hediye kutusu -> zarf -> mektup ----------
const e01=x=>x<0?0:x>1?1:x;
const bounceE=x=>{ const n=7.5625,d=2.75; if(x<1/d) return n*x*x; if(x<2/d){x-=1.5/d; return n*x*x+.75;} if(x<2.5/d){x-=2.25/d; return n*x*x+.9375;} x-=2.625/d; return n*x*x+.984375; };
const backOut=x=>{ const c=1.70158; x=e01(x)-1; return 1+(c+1)*x*x*x+c*x*x; };
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function giftBody(cx,base,rot,a){
  ctx.save(); ctx.globalAlpha=a; ctx.translate(cx,base); ctx.rotate(rot);
  ctx.fillStyle="#e6bf00"; ctx.fillRect(-65,-100,130,100);
  ctx.fillStyle=YEL; ctx.fillRect(-65,-100,122,100);
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(-65,-100,130,7);
  ctx.fillStyle="#2b4aa8"; ctx.fillRect(-11,-100,22,100);
  ctx.restore();
}
function giftLid(cx,base,rot,a,lx,ly,lr){
  ctx.save(); ctx.globalAlpha=a; ctx.translate(cx,base); ctx.rotate(rot); ctx.translate(lx,ly-115); ctx.rotate(lr);
  ctx.fillStyle="#e6bf00"; ctx.fillRect(-74,-15,148,30); ctx.fillStyle=YEL; ctx.fillRect(-74,-15,140,30);
  ctx.fillStyle="#2b4aa8"; ctx.fillRect(-11,-15,22,30);
  ctx.lineWidth=3; ctx.strokeStyle=YEL; ctx.fillStyle="#2b4aa8";
  [-1,1].forEach(sd=>{ ctx.save(); ctx.translate(sd*20,-24); ctx.rotate(sd*.5); ctx.beginPath(); ctx.ellipse(0,0,19,11,0,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); });
  ctx.beginPath(); ctx.arc(0,-20,8,0,7); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function envBack(cx,cy,w,h,flap,a){
  const l=cx-w/2,r=cx+w/2,t=cy-h/2; ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle="#d9bd6b"; ctx.fillRect(l,t,w,h);
  if(flap>=.5){ const ty=t+h*.55*Math.cos(flap*Math.PI); ctx.fillStyle="#c9ab55"; ctx.beginPath(); ctx.moveTo(l,t); ctx.lineTo(r,t); ctx.lineTo(cx,ty); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function envFront(cx,cy,w,h,flap,a){
  const l=cx-w/2,r=cx+w/2,t=cy-h/2,b=cy+h/2,py=t+h*.58; ctx.save(); ctx.globalAlpha=a;
  ctx.lineWidth=1.5; ctx.strokeStyle="#b99a45";
  ctx.fillStyle="#f6dd9c"; ctx.beginPath(); ctx.moveTo(l,t); ctx.lineTo(cx,py); ctx.lineTo(l,b); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r,t); ctx.lineTo(cx,py); ctx.lineTo(r,b); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#fbe9b7"; ctx.beginPath(); ctx.moveTo(l,b); ctx.lineTo(cx,py); ctx.lineTo(r,b); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(flap<.5){ const ty=t+h*.55*Math.cos(flap*Math.PI);
    ctx.fillStyle="#fff1c8"; ctx.beginPath(); ctx.moveTo(l,t); ctx.lineTo(r,t); ctx.lineTo(cx,ty); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=YEL; ctx.strokeStyle=NAVY; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,ty,w*.065,0,7); ctx.fill(); ctx.stroke(); }
  ctx.strokeRect(l,t,w,h);

function letter(cx,cy,sc,a){

  rr(-150,-230,300,460,16); ctx.fillStyle="#fffaf0"; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=YEL; ctx.stroke();
  ctx.fillStyle=NAVY; ctx.beginPath(); ctx.roundRect(-148,-228,296,66,[14,14,0,0]); ctx.fill();
  text("İYİ Kİ DOĞDUN",0,-195,26,YEL);
  const pw=250, ph=pw*PH_H/PH_W, py=-146;
  ctx.save(); rr(-pw/2,py,pw,ph,12); ctx.clip();
  if(photo.complete&&photo.naturalWidth) ctx.drawImage(photo,-pw/2,py,pw,ph); else { ctx.fillStyle="#ddd"; ctx.fillRect(-pw/2,py,pw,ph); }
  ctx.restore(); rr(-pw/2,py,pw,ph,12); ctx.lineWidth=4; ctx.strokeStyle=YEL; ctx.stroke();
  const my=py+ph+30;

function drawWin(){
  const cx=W/2, base=490;
  // başlık
  let ta=gp<2?e01(gt/.5):1-e01((gt-.5)/.4); if(gp===1) ta=1;
  if(ta>0){ ctx.globalAlpha=ta; text("TEBRİKLER!",W/2,115,38,YEL); text("Maçı kazandınız,",W/2,163,21); text("bu da sizin ödülünüz!",W/2,192,21); ctx.globalAlpha=1; }
  if(gp<2){
    let dy=0, rot=0, a=1;
    if(gp===0){ dy=-(1-bounceE(e01(gt/.9)))*430; if(gt>.9) rot=Math.sin(t*5)*.035; }
    else { if(gt<.5) rot=Math.sin(gt*70)*.05*(gt*2+.3); }
    const bb=base+dy;
    // zarf kutudan yükselir
    if(gp===1&&popped){ const k=backOut((gt-.5)/1.1), sc=.55+.45*k, ey=420+(300-420)*k;
      envBack(cx,ey,230*sc,150*sc,0,1); envFront(cx,ey,230*sc,150*sc,0,1); }
    giftBody(cx,bb,rot,a);
    let lx=0,ly=0,lr=0,la=1;
    if(gp===1&&popped){ const d=gt-.5; lx=140*d; ly=-520*d+700*d*d; lr=d*3.2; la=1-e01((d-.6)/.4); }
    if(la>0) giftLid(cx,bb,rot,la,lx,ly,lr);
    if(gp===0&&gt>1.2&&Math.sin(t*6)>-.3) text("Dokun: kutuyu aç",W/2,560,18,"#fff");
  } else {
    const fl=e01(gt/.7), lk=e01((gt-.7)/1.3), ez=backOut(lk);
    const ey=300+e01((gt-.9)/1)*(260), ea=1-e01((gt-1.0)/.8);
    if(ea>0){
      envBack(cx,ey,230,150,fl,ea);
    }
    // mektup: zarftan çıkıp büyür
    if(lk>0){ const sc=.5+.5*ez, cyL=(300-30)+(335-(300-30))*ez; 
      letter(cx,cyL,sc,1); }
    if(ea>0) envFront(cx,ey,230,150,fl,ea);
    if(gt>2.4&&Math.sin(t*6)>-.3) text("Dokun: tekrar oyna",W/2,600,15,"rgba(255,255,255,.85)");
  }
}

  const dr=(p,o)=>{ const j=(p.hr===null?0:jump(p.hr))+(p.bj>0?30*Math.sin(Math.PI*(1-p.bj/.35)):0);
    person(p.x,p.y,{...o,jump:j,up:(j>0||p.up>0)?1:0}); };

  ctx.fillStyle="#fff"; ctx.fillRect(14,NET-26,W-28,3); ctx.fillStyle=YEL; ctx.fillRect(8,NET-34,6,40); ctx.fillRect(W-14,NET-34,6,40);
  if(ball){ ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(ball.x,ball.y+1,Math.max(4,11-ball.z*.04),4,0,0,7); ctx.fill(); }
  [...MY].sort((a,b)=>a.y-b.y).forEach(p=>dr(p,{j:YEL,s:NAVY,hair:p.hair,tc:NAVY,name:p.name,num:p.num,tag:p.name}));
  if(ball) ballDraw(ball.x,ball.y-ball.z);
  if(sg&&sg.need&&sg.el>=0){ const rem=sg.dur-sg.el;
    if(rem>-.2&&rem<1.1){ const rad=14+70*ck(rem/1,0,1), good=Math.abs(rem)<.08, cx=sg.tx, cy=sg.ty-sg.tz;
      ctx.strokeStyle=good?YEL:"rgba(255,255,255,.85)"; ctx.lineWidth=good?5:3; ctx.beginPath(); ctx.arc(cx,cy,rad,0,7); ctx.stroke();
      text(sg.lbl,cx,cy-rad-12,sg.kind==="t3"?18:15,YEL); } }
  if(sg&&sg.kind==="o3"&&sg.el>=0&&!ball.blkDone){ const rb=sg.dur-sg.el;
    if(rb<.9){ const rad=14+70*ck(rb/.9,0,1), good=rb<.1;
      ctx.strokeStyle=good?YEL:"rgba(255,255,255,.85)"; ctx.lineWidth=good?5:3; ctx.beginPath(); ctx.arc(sg.tx,NET+24,rad,0,7); ctx.stroke();
      text("BLOK!",sg.tx,NET+24-rad-12,16,YEL); } }
  stands();
  // skor çubuğu
  ctx.fillStyle="#0b1633"; ctx.fillRect(0,58,W,40);
  drawLogo(logo,28,78,34); drawLogo(glogo,W-28,78,34,"GS");
  text("FB",68,78,18,YEL); text(fb+"  -  "+gs,W/2,76,26,"#fff"); text("GS",W-68,78,18,"#ff6b81");
  text("ilk "+GOAL,W/2,92,9,"rgba(255,255,255,.5)");
  if(state==="play"&&fb+gs===0&&sg&&sg.el<0) text("Servis sende: halka kapanınca dokun!",W/2,548,13,"#fff");
  if(popup){ ctx.globalAlpha=Math.min(1,popup.l*2); text(popup.t,W/2,215-(1-popup.l)*25,popup.t.length>9?26:30,YEL); ctx.globalAlpha=1; }
  if(state!=="win") drawParts();
  if(flash>0){ ctx.fillStyle="rgba(255,60,80,"+flash+")"; ctx.fillRect(0,0,W,H); }

  if(state==="start"){
    ctx.fillStyle="rgba(11,22,51,.93)"; ctx.fillRect(0,0,W,H);
    drawLogo(logo,W/2-78,92,92); text("VS",W/2,96,22,"#fff"); drawLogo(glogo,W/2+78,92,92,"GS");
    text("SMAÇ ZAMANI",W/2,166,34,YEL);
    text("Fenerbahçe 3v3 Galatasaray",W/2,200,15);
    text("Halka kapanınca dokun: PAS → SET → SMAÇ",W/2,228,12.5,YEL);
    text("Rakip smaç vurunca da BLOK için dokun!",W/2,247,12.5,"rgba(255,255,255,.8)");
  }
  if(state==="over"){
    ctx.fillStyle="rgba(11,22,51,.88)"; ctx.fillRect(0,0,W,H);
    text("Rövanş zamanı!",W/2,250,32,YEL); text(fb+" - "+gs,W/2,300,26);
    if(endT<=0) text("Dokun ve tekrar oyna",W/2,380,18,"rgba(255,255,255,.8)");
  }
  if(state==="win"){
    ctx.fillStyle="rgba(11,22,51,.88)"; ctx.fillRect(0,0,W,H);
    drawWin(); drawParts();
  }
}
const ov=document.getElementById("ov"), nm=document.getElementById("nm"), no=document.getElementById("no"), rd=document.getElementById("rd");
const ROLES=["Sol file: sürekli smaç vurursun, en çok sen atak yaparsın.","Sağ file: oyunu sen kurarsın, en çok set sende.","Arka hat: servisleri ve savunmayı sen karşılarsın."];
function setRole(r){ ROLE=r; document.querySelectorAll("#roles button").forEach(b=>b.classList.toggle("on",+b.dataset.r===r)); rd.textContent=ROLES[r]; }
document.querySelectorAll("#roles button").forEach(b=>b.addEventListener("click",()=>setRole(+b.dataset.r)));
document.getElementById("go").addEventListener("click",()=>{
  NAME=(nm.value.trim()||"OYUNCU").toLocaleUpperCase("tr-TR").slice(0,12); const n=parseInt(no.value); NUM=isNaN(n)?10:ck(n,0,99);
  initAudio(); setup(); begin(); });
function fitOv(){ const r=cv.getBoundingClientRect(); ov.style.cssText="left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px;--s:"+(r.width/360)+";display:"+(state==="start"?"block":"none"); }
addEventListener("resize",fitOv); setRole(0); setup();
let ovState=null;
function loop(n){ if(ovState!==state){ ovState=state; fitOv(); } const dt=Math.min(.033,(n-last)/1000); last=n; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
